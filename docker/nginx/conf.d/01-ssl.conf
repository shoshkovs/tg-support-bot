server {
    listen 443 ssl;
    server_name help.gramila-brooks.site;

    ssl_certificate /etc/letsencrypt/live/help.gramila-brooks.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/help.gramila-brooks.site/privkey.pem;

    client_max_body_size 60M;

    root /var/www/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/public$fastcgi_script_name;
    }

    location /socket.io/ {
        proxy_pass http://node_server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}
